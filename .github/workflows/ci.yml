name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  api-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/foodtruck
      JWT_SECRET_KEY: test-secret
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foodtruck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Type check
        run: mypy app/api/routes/health.py

      - name: Tests
        run: PYTHONPATH=. pytest -q

      - name: Alembic dry-run
        run: PYTHONPATH=. alembic upgrade head --sql > /tmp/alembic_dry_run.sql
